# =============================================================================
# Docker Compose Development Configuration
# =============================================================================
# This configuration is optimized for development workflows with hot-reloading
# and development tools.
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up development
#   docker-compose -f docker-compose.dev.yml down
#
# For more information, see BUILDING.md
# =============================================================================

version: '3.8'

services:
  # Main development container
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      # Mount source code for hot-reloading
      - type: bind
        source: .
        target: /workspace
        consistency: cached
      # Mount build directory
      - type: bind
        source: ./build
        target: /workspace/build
      # Mount development tools
      - type: volume
        source: dev-tools
        target: /usr/local/tools
    working_dir: /workspace
    command: >
      sh -c "
        # Install development tools if not present
        if [ ! -d /usr/local/tools ]; then
          cd /tmp && \
          git clone https://github.com/catchorg/Catch2.git && \
          cd Catch2 && \
          cmake -B build -DCMAKE_BUILD_TYPE=Release && \
          cmake --build build && \
          cmake --install build
          rm -rf /tmp/Catch2
        fi
        # Start development shell
        exec bash
      "
    environment:
      - CC=gcc
      - CXX=g++
      - TERM=xterm-256color
      - EDITOR=vim
      - SHELL=/bin/bash
    stdin_open: true
    tty: true
    networks:
      - dev-network
    depends_on:
      - deps

  # Dependency service (lightweight)
  deps:
    image: alpine
    volumes:
      - type: volume
        source: build-cache
        target: /cache
    command: sleep infinity
    networks:
      - dev-network

  # Build runner (for background builds)
  build-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - type: bind
        source: ./build
        target: /workspace/build
    working_dir: /workspace
    command: sleep infinity
    networks:
      - dev-network
    profiles:
      - build

networks:
  dev-network:
    driver: bridge

volumes:
  dev-tools:
    driver: local
  build-cache:
    driver: local