version: "3.9"

services:
  zenith-backend:
    build: .
    ports:
      - "54320:54320"
      - "54321:54321"
      - "8000:8000"
    volumes:
      - ./backend/signaling/cert.pem:/opt/zenith/backend/signaling/cert.pem:ro
      - ./backend/signaling/key.pem:/opt/zenith/backend/signaling/key.pem:ro
      - ./logs/zenith-backend.log:/var/log/zenith-backend.log
    environment:
      - ZENITH_SIGNALING_HOST=0.0.0.0
      - ZENITH_SIGNALING_PORT=54320
      - ZENITH_SIGNALING_UDP_PORT=54321
    command: ["--log-file", "/var/log/zenith-backend.log", "--health-port", "8000"]
    restart: unless-stopped
