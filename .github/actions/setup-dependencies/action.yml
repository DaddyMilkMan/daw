name: Setup Dependencies
description: Setup build dependencies for Zenith DAW
inputs:
  os:
    description: 'Operating system (ubuntu-latest, macos-latest, windows-latest)'
    required: true
    default: ubuntu-latest
outputs:
  cmake-version:
    description: 'CMake version'
    value: ${{ steps.cmake.outputs.version }}
runs:
  using: "composite"
  steps:
    - name: Setup system packages
      shell: bash
      run: |
        if [ "${{ inputs.os }}" = "ubuntu-latest" ]; then
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libasound2-dev libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libjack-dev libpulse-dev libgtk-3-dev
        elif [ "${{ inputs.os }}" = "macos-latest" ]; then
          brew update
          brew install cmake ninja pkg-config jack
        elif [ "${{ inputs.os }}" = "windows-latest" ]; then
          choco install -y cmake ninja pkgconf vcpkg
        fi

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Python dependencies
      shell: bash
      run: |
        pip install conan pyyaml tqdm requests

    - name: Install Node.js dependencies
      shell: bash
      run: |
        npm install -g nodemon

    - name: Setup CMake
      shell: bash
      run: |
        if [ "${{ inputs.os }}" = "ubuntu-latest" ]; then
          wget https://github.com/Kitware/CMake/releases/download/v3.25/cmake-3.25.1-linux-x86_64.sh
          sudo sh cmake-3.25.1-linux-x86_64.sh --skip-license --prefix=/usr/local
          echo "/usr/local/bin" >> $GITHUB_PATH
        fi
      id: cmake
      env:
        cmake-version: 3.25.1

    - name: Setup vcpkg
      if: inputs.os == 'windows-latest'
      shell: bash
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.bat
        echo "$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_PATH

    - name: Setup vcpkg (Unix)
      if: inputs.os != 'windows-latest'
      shell: bash
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh
        echo "$GITHUB_WORKSPACE/vcpkg" >> $GITHUB_PATH