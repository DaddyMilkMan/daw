name: Automation

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    # Run daily maintenance at 4 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Automation type'
        required: true
        type: choice
        options:
        - maintenance
        - dependencies
        - documentation
        - releases

jobs:
  # Maintenance tasks
  maintenance:
    name: Maintenance Tasks
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.type == 'maintenance'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Run maintenance tasks
      run: |
        # Clean up old branches
        git remote prune origin

        # Update documentation
        python scripts/maintenance/update-docs.py

        # Check for TODO comments
        grep -r "TODO\|FIXME\|XXX" apps/ modules/ --include="*.cpp" --include="*.h" | head -20

        # Generate maintenance report
        echo "# Maintenance Report" > maintenance-report.md
        echo "Generated on: $(date)" >> maintenance-report.md
        echo "" >> maintenance-report.md
        echo "## TODO Comments" >> maintenance-report.md
        grep -r "TODO\|FIXME\|XXX" apps/ modules/ --include="*.cpp" --include="*.h" | head -10 >> maintenance-report.md

    - name: Upload maintenance report
      uses: actions/upload-artifact@v4
      with:
        name: maintenance-report
        path: maintenance-report.md
        retention-days: 7

  # Dependency updates
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.type == 'dependencies'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Update Node.js dependencies
      run: |
        npm outdated --json > npm-outdated.json
        if [ -s npm-outdated.json ]; then
          npm update
          npm audit fix
        fi

    - name: Update Python dependencies
      run: |
        pip list --outdated --format=json > pip-outdated.json
        if [ -s pip-outdated.json ]; then
          pip-compile --upgrade requirements.in
          pip install -r requirements.txt
        fi

    - name: Update CMake dependencies
      run: |
        # Update vcpkg packages
        vcpkg update

    - name: Create dependency update PR
      uses: peter-evans/create-pull-request@v6
      with:
        title: "Update Dependencies"
        body: |
          This PR updates project dependencies.

          ## Changes
          - Updated Node.js packages
          - Updated Python packages
          - Updated vcpkg packages

          ## Verification
          - All tests pass
          - No breaking changes
          - Security issues resolved
        branch: dependency-update
        base: develop
        labels: dependencies, automated, maintenance

  # Documentation updates
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.type == 'documentation'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Update documentation
      run: |
        python scripts/maintenance/update-docs.py

        # Update API documentation
        doxygen -g Doxyfile
        # Configure and run Doxygen
        doxygen Doxyfile

        # Update README with latest version
        python scripts/maintenance/update-readme.py

    - name: Create documentation update PR
      uses: peter-evans/create-pull-request@v6
      with:
        title: "Update Documentation"
        body: |
          This PR updates project documentation.

          ## Changes
          - Updated API documentation
          - Updated README
          - Fixed broken links

          ## Verification
          - All documentation builds successfully
          - Links are valid
          - Documentation is up-to-date
        branch: documentation-update
        base: develop
        labels: documentation, automated, maintenance

  # Issue management
  issue-management:
    name: Issue Management
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
    - name: Close stale issues
      uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue has been marked as stale due to inactivity. Please provide an update or this will be closed in 7 days.'
        days-before-stale: 30
        days-before-close: 7
        exempt-issue-labels: 'pinned,security,backlog,approved'

    - name: Close stale pull requests
      uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-pr-message: 'This pull request has been marked as stale due to inactivity. Please provide an update or this will be closed in 14 days.'
        days-before-stale: 14
        days-before-close: 7
        exempt-issue-labels: 'pinned,security,approved'
        stale-pr-label: 'stale'

    - name: Add 'good first issue' labels
      uses: actions/github-script@v7
      with:
        script: |
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'good-first-issue',
            per_page: 100
          });

          for (const issue of issues.data) {
            if (!issue.labels.some(label => label.name === 'good-first-issue')) {
              await github.rest.issues.addLabels({
                issue_number: issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['good-first-issue']
              });
            }
          }

  # Comment on PRs
  pr-comments:
    name: PR Comments
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
    - name: Add PR comments
      uses: actions/github-script@v7
      with:
        script: |
          // Get open PRs
          const prs = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            per_page: 50
          });

          for (const pr of prs.data) {
            // Add comment if no recent activity
            const lastComment = await github.rest.issues.listComments({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            if (lastComment.data.length === 0) {
              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '👋 This PR has been inactive. Please update it or it will be marked as stale.'
              });
            }
          }

  # Cache management
  cache-management:
    name: Cache Management
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clear caches
      run: |
        # Clear npm cache
        npm cache clean --force

        # Clear pip cache
        pip cache purge

        # Clear vcpkg cache
        rm -rf ~/.cache/vcpkg/

        # Clear build cache
        rm -rf build/
        rm -rf _deps/

    - name: Upload cache cleanup report
      uses: actions/upload-artifact@v4
      with:
        name: cache-cleanup-report
        path: |
          npm-list.txt
          pip-list.txt
        retention-days: 7