name: Performance and Profiling

on:
  push:
    branches: [ master, main, work/* ]
  pull_request:
    branches: [ master, main, work/* ]

jobs:
  # Performance benchmarking
  benchmarking:
    name: Performance Benchmarking
    runs-on: ubuntu-latest
    strategy:
      matrix:
        benchmark_type: [audio, cpu, memory, disk]
        build_type: [Debug, Release]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup CMake
      uses: jcbhmr/action-cmake@v2.2.0
      with:
        cmake-version: '3.25.3'

    - name: Install benchmark dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          libasound2-dev \
          libpulse-dev \
          libjack-dev \
          libbenchmark-dev \
          google-perftools \
          valgrind \
          kcachegrind

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p build
        cd build
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_STANDARD=20 \
          -DBUILD_BENCHMARKS=ON \
          -DBUILD_TESTS=ON \
          ..

    - name: Build benchmarks
      working-directory: ${{github.workspace}}/build
      run: ninja benchmarks

    - name: Run audio benchmarks
      if: matrix.benchmark_type == 'audio'
      working-directory: ${{github.workspace}}/build
      run: |
        ./audio_benchmark --benchmark_time_unit=ms --benchmark_out=audio_benchmark_results.json

    - name: Run CPU benchmarks
      if: matrix.benchmark_type == 'cpu'
      working-directory: ${{github.workspace}}/build
      run: |
        ./cpu_benchmark --benchmark_time_unit=ms --benchmark_out=cpu_benchmark_results.json

    - name: Run memory benchmarks
      if: matrix.benchmark_type == 'memory'
      working-directory: ${{github.workspace}}/build
      run: |
        ./memory_benchmark --benchmark_time_unit=ms --benchmark_out=memory_benchmark_results.json

    - name: Run disk benchmarks
      if: matrix.benchmark_type == 'disk'
      working-directory: ${{github.workspace}}/build
      run: |
        ./disk_benchmark --benchmark_time_unit=ms --benchmark_out=disk_benchmark_results.json

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.benchmark_type }}-benchmarks-${{ matrix.build_type }}
        path: |
          build/*.json
          build/benchmark_results/
        retention-days: 90

  # Profiling
  profiling:
    name: Profiling
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install profiling tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          libasound2-dev \
          libpulse-dev \
          libjack-dev \
          valgrind \
          kcachegrind \
          perf \
          gprof2dot \
          graphviz

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p build
        cd build
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-g3 -O0" \
          -DBUILD_TESTS=ON \
          ..

    - name: Build with debug symbols
      working-directory: ${{github.workspace}}/build
      run: ninja

    - name: Run with Valgrind
      working-directory: ${{github.workspace}}/build
      run: |
        valgrind --tool=callgrind \
          --dump-instr=yes \
          --collect-jumps=yes \
          --simulate-cache=yes \
          --trace-children=yes \
          ./ZenithDesktop \
          --test-profile > valgrind.log 2>&1

    - name: Generate call graph
      run: |
        callgrind_annotate --auto=yes --tree=both --threshold=5 valgrind.out.12345 > callgraph.txt

    - name: Generate flame graph
      run: |
        perf record -g ./ZenithDesktop --test-flame-graph
        perf script > perf.txt
        git clone https://github.com/brendangregg/FlameGraph.git
        FlameGraph/flamegraph.pl perf.txt > flamegraph.svg

    - name: Upload profiling results
      uses: actions/upload-artifact@v3
      with:
        name: profiling-results
        path: |
          build/valgrind.log
          build/callgraph.txt
          build/flamegraph.svg
          build/perf.txt
        retention-days: 30

  # Memory analysis
  memory-analysis:
    name: Memory Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install memory analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          libasound2-dev \
          libpulse-dev \
          libjack-dev \
          valgrind \
          massif \
          heaptrack

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p build
        cd build
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-g3 -O0" \
          -DBUILD_TESTS=ON \
          ..

    - name: Build with debug symbols
      working-directory: ${{github.workspace}}/build
      run: ninja

    - name: Run Massif
      working-directory: ${{github.workspace}}/build
      run: |
        massif --stacks --pages-as-heap=yes ./ZenithDesktop --test-memory > massif.log 2>&1

    - name: Generate Massif report
      run: |
        ms_print massif.out.12345 > massif_report.txt

    - name: Run HeapTrack
      working-directory: ${{github.workspace}}/build
      run: |
        heaptrack ./ZenithDesktop --test-memory > heaptrack.log 2>&1

    - name: Upload memory analysis results
      uses: actions/upload-artifact@v3
      with:
        name: memory-analysis-results
        path: |
          build/massif.*
          build/massif_report.txt
          build/heaptrack.*
          build/heaptrack_report.txt
        retention-days: 30

  # Leak detection
  leak-detection:
    name: Memory Leak Detection
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install leak detection tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          libasound2-dev \
          libpulse-dev \
          libjack-dev \
          valgrind

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p build
        cd build
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-g3 -O0" \
          -DBUILD_TESTS=ON \
          ..

    - name: Build with debug symbols
      working-directory: ${{github.workspace}}/build
      run: ninja

    - name: Run leak detection
      working-directory: ${{github.workspace}}/build
      run: |
        valgrind --tool=memcheck \
          --leak-check=full \
          --show-leak-kinds=all \
          --track-origins=yes \
          --verbose \
          ./ZenithDesktop --test-leak-detection > leak_detection.log 2>&1

    - name: Analyze leak report
      run: |
        if grep -q "definitely lost" build/leak_detection.log; then
          echo "MEMORY LEAKS DETECTED!"
          exit 1
        fi

    - name: Upload leak detection results
      uses: actions/upload-artifact@v3
      with:
        name: leak-detection-results
        path: build/leak_detection.log
        retention-days: 30

  # CPU performance analysis
  cpu-performance:
    name: CPU Performance Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install CPU analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          libasound2-dev \
          libpulse-dev \
          libjack-dev \
          perf \
          gprof2dot \
          graphviz

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p build
        cd build
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          ..

    - name: Build with optimizations
      working-directory: ${{github.workspace}}/build
      run: ninja

    - name: Run with perf
      working-directory: ${{github.workspace}}/build
      run: |
        perf record -g -- ./ZenithDesktop --test-performance > perf.log 2>&1

    - name: Generate CPU profile
      run: |
        perf script > perf.txt
        gprof2dot perf.txt | dot -Tpng -o cpu_profile.png

    - name: Analyze hotspots
      run: |
        perf report > cpu_hotspots.txt

    - name: Upload CPU analysis results
      uses: actions/upload-artifact@v3
      with:
        name: cpu-performance-results
        path: |
          build/perf.log
          build/perf.txt
          build/cpu_profile.png
          build/cpu_hotspots.txt
        retention-days: 30

  # Performance regression testing
  regression-testing:
    name: Performance Regression Testing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        pip install pyyaml matplotlib

    - name: Download baseline results
      run: |
        # Download baseline from previous run
        echo "Downloading baseline performance results..."

    - name: Run performance regression test
      run: |
        python scripts/performance_regression_test.py

    - name: Upload regression test results
      uses: actions/upload-artifact@v3
      with:
        name: regression-test-results
        path: |
          performance_regression_report.html
          performance_baseline.json
          performance_current.json
        retention-days: 90

  # Performance summary
  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-latest
    needs: [benchmarking, profiling, memory-analysis, leak-detection, cpu-performance, regression-testing]
    if: always()
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Generate performance summary
      run: |
        echo "## Performance and Profiling Summary" >> $GITHUB_STEP_SUMMARY
        echo "### Benchmarking: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Profiling: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Memory Analysis: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Leak Detection: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### CPU Performance: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Regression Testing: ✅" >> $GITHUB_STEP_SUMMARY