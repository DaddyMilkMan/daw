name: PR Triage and Labeling

on:
  # pull_request:
  #   types: [opened, synchronize, reopened, edited]

jobs:
  # PR classification
  classify-pr:
    name: Classify PR
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PR classifier
      run: |
        pip install requests

    - name: Classify PR
      run: |
        python .github/scripts/classify_pr.py \
          --repo "${{ github.repository }}" \
          --pr "${{ github.event.number }}" \
          --title "${{ github.event.pull_request.title }}" \
          --body "${{ github.event.pull_request.body }}"

    - name: Apply labels
      uses: actions/github-script@v6
      with:
        script: |
          const prNumber = context.issue.number;
          const repo = context.repo;

          // Get PR classification from previous step
          const classification = fs.readFileSync('classification.txt', 'utf8');

          const labels = classification.split('\n').filter(label => label.trim());

          // Remove existing labels
          await github.rest.issues.removeLabel({
            ...repo,
            issue_number: prNumber,
            name: 'needs-label'
          });

          // Apply new labels
          for (const label of labels) {
            await github.rest.issues.addLabels({
              ...repo,
              issue_number: prNumber,
              labels: [label]
            });
          }

  # Required checks
  required-checks:
    name: Required Checks
    runs-on: ubuntu-latest
    steps:
    - name: Check if PR requires additional checks
      uses: actions/github-script@v6
      with:
        script: |
          const prNumber = context.issue.number;
          const repo = context.repo;

          const { data: pullRequest } = await github.rest.pulls.get({
            ...repo,
            pull_number: prNumber
          });

          // Determine if PR requires additional checks
          const requiresSecurityCheck = pullRequest.title.includes('security') ||
                                     pullRequest.body.toLowerCase().includes('security');
          const requiresPerformanceCheck = pullRequest.title.includes('performance') ||
                                         pullRequest.body.toLowerCase().includes('performance');
          const requiresDocumentationCheck = pullRequest.title.includes('doc') ||
                                           pullRequest.body.toLowerCase().includes('documentation');

          // Add labels based on requirements
          if (requiresSecurityCheck) {
            await github.rest.issues.addLabels({
              ...repo,
              issue_number: prNumber,
              labels: ['security-check-required']
            });
          }

          if (requiresPerformanceCheck) {
            await github.rest.issues.addLabels({
              ...repo,
              issue_number: prNumber,
              labels: ['performance-check-required']
            });
          }

          if (requiresDocumentationCheck) {
            await github.rest.issues.addLabels({
              ...repo,
              issue_number: prNumber,
              labels: ['documentation-check-required']
            });
          }

  # Assign reviewers
  assign-reviewers:
    name: Assign Reviewers
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install reviewer assignment tool
      run: |
        pip install requests

    - name: Assign reviewers
      run: |
        python .github/scripts/assign_reviewers.py \
          --repo "${{ github.repository }}" \
          --pr "${{ github.event.number }}" \
          --title "${{ github.event.pull_request.title }}" \
          --body "${{ github.event.pull_request.body }}"

  # Size classification
  size-classification:
    name: Size Classification
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install PR size calculator
      run: |
        pip install requests

    - name: Calculate PR size
      run: |
        python .github/scripts/pr_size_calculator.py \
          --repo "${{ github.repository }}" \
          --pr "${{ github.event.number }}"

    - name: Apply size label
      uses: actions/github-script@v6
      with:
        script: |
          const prNumber = context.issue.number;
          const repo = context.repo;

          // Get PR size
          const size = fs.readFileSync('pr_size.txt', 'utf8');

          let sizeLabel = '';
          if (size < 10) {
            sizeLabel = 'size-xs';
          } else if (size < 30) {
            sizeLabel = 'size-s';
          } else if (size < 100) {
            sizeLabel = 'size-m';
          } else if (size < 500) {
            sizeLabel = 'size-l';
          } else {
            sizeLabel = 'size-xl';
          }

          await github.rest.issues.addLabels({
            ...repo,
            issue_number: prNumber,
            labels: [sizeLabel]
          });

  # Notify on PR changes
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [classify-pr, required-checks, assign-reviewers, size-classification]
    if: always()
    steps:
    - name: Generate notification
      run: |
        echo "## PR Triage Summary" >> $GITHUB_STEP_SUMMARY
        echo "### Classification: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Required Checks: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Reviewers: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Size Classification: ✅" >> $GITHUB_STEP_SUMMARY