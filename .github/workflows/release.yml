name: Release Automation

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

jobs:
  # Validate tag format
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}
    steps:
    - name: Extract version from tag
      id: extract
      run: |
        TAG_NAME="${GITHUB_REF#refs/tags/}"
        echo "version=${TAG_NAME}" >> $GITHUB_OUTPUT
        if [[ "${TAG_NAME}" =~ .*-rc\. ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
        fi

  # Build and test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: validate-tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
          - os: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          libasound2-dev \
          libpulse-dev \
          libjack-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxext-dev \
          libxrender-dev \
          libxcomposite-dev \
          libxtst-dev \
          libxss1 \
          libgtk-3-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libcurl4-openssl-dev \
          libsamplerate0-dev \
          librubberband-dev \
          libfftw3-dev \
          libsphinxbase-dev \
          libglib2.0-dev \
          libgconf-2.4-dev \
          libdbus-1-dev \
          libssl-dev \
          libffi-dev \
          libgirepository1.0-dev

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p build
        cd build
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler || 'clang++' }} \
          -DCMAKE_C_COMPILER=${{ matrix.compiler || 'clang' }} \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DCMAKE_CXX_EXTENSIONS=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=OFF \
          -DBENCHMARK_ENABLE=OFF \
          ..

    - name: Build
      working-directory: ${{github.workspace}}/build
      run: ninja -j$(nproc)

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ninja test

  # Create release assets
  create-assets:
    name: Create Release Assets
    runs-on: ubuntu-latest
    needs: [validate-tag, build-and-test]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install fpm
      run: |
        sudo apt-get install -y ruby ruby-dev build-essential
        sudo gem install fpm

    - name: Build packages
      run: |
        VERSION=${{ needs.validate-tag.outputs.version }}

        # Create source distribution
        mkdir -p release/dist
        tar -czf release/dist/zenith-daw-${VERSION}-src.tar.gz \
          --exclude=.git \
          --exclude=build \
          --exclude=release \
          --exclude=*.log \
          .

        # Create Debian package
        fpm -t deb \
          -n zenith-daw \
          -v ${VERSION} \
          -C release \
          --description "Zenith Digital Audio Workstation" \
          --url "https://github.com/${{ github.repository }}" \
          --license "GPL-3.0" \
          --maintainer "${{ github.actor }}@users.noreply.github.com" \
          --before-install scripts/preinst \
          --after-install scripts/postinst \
          .

        # Create RPM package
        fpm -t rpm \
          -n zenith-daw \
          -v ${VERSION} \
          -C release \
          --description "Zenith Digital Audio Workstation" \
          --url "https://github.com/${{ github.repository }}" \
          --license "GPL-3.0" \
          --maintainer "${{ github.actor }}@users.noreply.github.com" \
          --before-install scripts/preinst \
          --after-install scripts/postinst \
          .

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-assets
        path: release/dist/
        retention-days: 90

  # Create release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate-tag, create-assets]
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-assets

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Zenith DAW ${{ needs.validate-tag.outputs.version }}
        body: |
          ## Release Notes

          Zenith DAW version ${{ needs.validate-tag.outputs.version }}

          ### Features
          - TODO: Add release notes

          ### Bug Fixes
          - TODO: Add bug fixes

          ### Known Issues
          - TODO: Add known issues

          ### Installation
          - Download the appropriate package for your platform
          - Follow the installation instructions in the documentation

          ### Support
          - Report issues: https://github.com/${{ github.repository }}/issues
          - Documentation: https://zenith-daw.readthedocs.io

          ### Credits
          Thanks to all contributors who made this release possible!

        draft: false
        prerelease: ${{ needs.validate-tag.outputs.is_prerelease }}
        files: |
          *.tar.gz
          *.deb
          *.rpm
          *.dmg
          *.exe
          *.msi
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Update version in documentation
  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install documentation dependencies
      run: |
        pip install sphinx sphinx-rtd-theme recommonmark

    - name: Update version in documentation
      run: |
        VERSION=${{ needs.validate-tag.outputs.version }}
        sed -i "s/version = .*/version = '${VERSION}'/" docs/conf.py
        sed -i "s/release = .*/release = '${VERSION}'/" docs/conf.py

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Commit documentation updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/conf.py docs/_build/html/
        git commit -m "Update documentation for release $VERSION"
        git push

  # Notify on release
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [create-release, update-docs]
    if: always()
    steps:
    - name: Notify on success
      if: needs.create-release.result == 'success'
      run: |
        echo "🎉 Release ${{ needs.validate-tag.outputs.version }} created successfully!"
        echo "📦 Release artifacts available at: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        echo "📚 Documentation updated at: https://zenith-daw.readthedocs.io"

    - name: Notify on failure
      if: needs.create-release.result == 'failure'
      run: |
        echo "❌ Release creation failed!"