name: Zenith DAW CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run full test suite daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # =============================================================================
  # BUILD & TEST - Ubuntu Linux (Primary Platform)
  # =============================================================================
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        compiler: [gcc-12, clang-15]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Setup Build Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg
          build/vcpkg_installed
          ~/.ccache
        key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-
          ${{ runner.os }}-${{ matrix.compiler }}-
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake ninja-build \
          libasound2-dev libjack-jackd2-dev \
          libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxinerama-dev libxrandr-dev \
          libxcursor-dev libxcomposite-dev libxdamage-dev \
          libegl1-mesa-dev libgl1-mesa-dev \
          libvulkan-dev vulkan-tools \
          ccache \
          python3 python3-pip
        
        # Install compiler
        if [ "${{ matrix.compiler }}" = "gcc-12" ]; then
          sudo apt-get install -y gcc-12 g++-12
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV
        elif [ "${{ matrix.compiler }}" = "clang-15" ]; then
          sudo apt-get install -y clang-15 libc++-15-dev libc++abi-15-dev
          echo "CC=clang-15" >> $GITHUB_ENV
          echo "CXX=clang++-15" >> $GITHUB_ENV
        fi
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DZENITH_BUILD_TESTS=ON \
          -DZENITH_ENABLE_WCET=ON \
          -DZENITH_ENABLE_COVERAGE=${{ matrix.build_type == 'Debug' && matrix.compiler == 'gcc-12' && 'ON' || 'OFF' }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    
    - name: Build Application
      run: cmake --build build --target ZenithDAW -j$(nproc)
    
    - name: Build Tests
      run: cmake --build build --target ZenithTests -j$(nproc)
    
    - name: Run Unit Tests
      run: |
        cd build
        ctest --output-on-failure --timeout 120 2>&1 | tee test_output.log
      timeout-minutes: 10
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-linux-${{ matrix.compiler }}-${{ matrix.build_type }}
        path: build/test_output.log
        if-no-files-found: ignore

  # =============================================================================
  # SANITIZER BUILDS - Linux (ASan+UBSan and TSan; block merge on failure)
  # =============================================================================
  sanitizer-linux-asan:
    name: Linux ASan+UBSan (Clang)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake ninja-build \
          clang-15 libc++-15-dev libc++abi-15-dev \
          libasound2-dev libjack-jackd2-dev \
          libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxinerama-dev libxrandr-dev \
          libxcursor-dev libxcomposite-dev libxdamage-dev \
          libegl1-mesa-dev libgl1-mesa-dev

    - name: Configure CMake (ASan preset)
      env:
        CC: clang-15
        CXX: clang++-15
      run: cmake --preset linux-asan

    - name: Build Tests
      run: cmake --build --preset linux-asan --target ZenithTests -j$(nproc)

    - name: Run Tests under ASan
      env:
        ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:check_initialization_order=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        cd build-asan
        ctest --output-on-failure --timeout 120 2>&1 | tee asan_output.log
      timeout-minutes: 15

    - name: Upload ASan Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: asan-results-linux
        path: build-asan/asan_output.log
        if-no-files-found: ignore

  sanitizer-linux-tsan:
    name: Linux TSan (Clang)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake ninja-build \
          clang-15 libc++-15-dev libc++abi-15-dev \
          libasound2-dev libjack-jackd2-dev \
          libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxinerama-dev libxrandr-dev \
          libxcursor-dev libxcomposite-dev libxdamage-dev \
          libegl1-mesa-dev libgl1-mesa-dev

    - name: Configure CMake (TSan preset)
      env:
        CC: clang-15
        CXX: clang++-15
      run: cmake --preset linux-tsan

    - name: Build Tests
      run: cmake --build --preset linux-tsan --target ZenithTests -j$(nproc)

    - name: Run Tests under TSan
      env:
        TSAN_OPTIONS: halt_on_error=1:detect_deadlocks=1:history_size=7:second_deadlock_stack=1
      run: |
        cd build-tsan
        ctest --output-on-failure --timeout 120 2>&1 | tee tsan_output.log
      timeout-minutes: 20

    - name: Upload TSan Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tsan-results-linux
        path: build-tsan/tsan_output.log
        if-no-files-found: ignore

  # =============================================================================
  # BUILD & TEST - macOS
  # =============================================================================
  build-macos:
    runs-on: macos-13
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Setup Build Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/vcpkg
          build/vcpkg_installed
          ~/Library/Caches/ccache
        key: ${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.build_type }}-
          ${{ runner.os }}-
    
    - name: Install Dependencies
      run: |
        brew install cmake ninja ccache
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DZENITH_BUILD_TESTS=ON \
          -DZENITH_ENABLE_WCET=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    
    - name: Build Application
      run: cmake --build build --target ZenithDAW
    
    - name: Build Tests
      run: cmake --build build --target ZenithTests
    
    - name: Run Unit Tests
      run: |
        cd build
        ctest --output-on-failure --timeout 120 2>&1 | tee test_output.log
      timeout-minutes: 10
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-macos-${{ matrix.build_type }}
        path: build/test_output.log
        if-no-files-found: ignore

  # =============================================================================
  # SANITIZER BUILD - macOS (ASan+UBSan; block merge on failure)
  # =============================================================================
  sanitizer-macos-asan:
    name: macOS ASan+UBSan
    runs-on: macos-13
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        brew install cmake ninja

    - name: Configure CMake (ASan preset)
      run: cmake --preset macos-asan

    - name: Build Tests
      run: cmake --build --preset macos-asan --target ZenithTests

    - name: Run Tests under ASan
      env:
        # macOS leak detection via LSan is unsupported; disable detect_leaks
        ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: |
        cd build-asan
        ctest --output-on-failure --timeout 120 2>&1 | tee asan_output.log
      timeout-minutes: 15

    - name: Upload ASan Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: asan-results-macos
        path: build-asan/asan_output.log
        if-no-files-found: ignore

  # =============================================================================
  # BUILD & TEST - Windows
  # =============================================================================
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Setup Build Cache
      uses: actions/cache@v4
      with:
        path: |
          ~\AppData\Local\vcpkg
          build\vcpkg_installed
        key: ${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.build_type }}-
          ${{ runner.os }}-
    
    - name: Install Dependencies
      run: |
        choco install ninja -y
    
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DZENITH_BUILD_TESTS=ON `
          -DZENITH_ENABLE_WCET=ON
    
    - name: Build Application
      run: cmake --build build --target ZenithDAW
    
    - name: Build Tests
      run: cmake --build build --target ZenithTests
    
    - name: Run Unit Tests
      run: |
        cd build
        ctest --output-on-failure --timeout 120 2>&1 | Tee-Object -FilePath test_output.log
      timeout-minutes: 10
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-windows-${{ matrix.build_type }}
        path: build\test_output.log
        if-no-files-found: ignore

  # =============================================================================
  # CODE COVERAGE (Linux/GCC Debug only)
  # =============================================================================
  coverage:
    runs-on: ubuntu-22.04
    needs: build-linux
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build \
          gcc-12 g++-12 \
          libasound2-dev libjack-jackd2-dev \
          libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxinerama-dev libxrandr-dev \
          libxcursor-dev libxcomposite-dev libxdamage-dev \
          libegl1-mesa-dev libgl1-mesa-dev \
          lcov gcovr
    
    - name: Configure CMake (Debug with Coverage)
      env:
        CC: gcc-12
        CXX: g++-12
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DZENITH_BUILD_TESTS=ON \
          -DZENITH_ENABLE_COVERAGE=ON
    
    - name: Build with Coverage
      run: cmake --build build --target ZenithTests -j$(nproc)
    
    - name: Run Tests with Coverage
      run: |
        cd build
        ctest --output-on-failure --timeout 120
      timeout-minutes: 10
    
    - name: Generate Coverage Report
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/external/*' '*/tests/*' --output-file coverage.info
        lcov --list coverage.info
        genhtml coverage.info --output-directory coverage_report
    
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/coverage_report

  # =============================================================================
  # SECURITY SCANNING
  # =============================================================================
  security-scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: cpp, python
        queries: security-extended,security-and-quality
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # =============================================================================
  # CI GATE — all required checks must pass before merging
  # =============================================================================
  ci-gate:
    name: CI Gate (required for merge)
    runs-on: ubuntu-22.04
    needs:
      - build-linux
      - build-macos
      - build-windows
      - sanitizer-linux-asan
      - sanitizer-linux-tsan
      - sanitizer-macos-asan
    if: always()
    permissions: {}
    steps:
    - name: Evaluate required checks
      run: |
        results=(
          "${{ needs.build-linux.result }}"
          "${{ needs.build-macos.result }}"
          "${{ needs.build-windows.result }}"
          "${{ needs.sanitizer-linux-asan.result }}"
          "${{ needs.sanitizer-linux-tsan.result }}"
          "${{ needs.sanitizer-macos-asan.result }}"
        )
        failed=0
        for r in "${results[@]}"; do
          if [[ "$r" != "success" && "$r" != "skipped" ]]; then
            echo "❌ A required check failed: $r"
            failed=1
          fi
        done
        if [[ $failed -eq 1 ]]; then
          echo "One or more required CI checks failed. Merge is blocked."
          exit 1
        fi
        echo "✅ All required CI checks passed."

  # =============================================================================
  # RELEASE BUILD
  # =============================================================================
  release:
    runs-on: ${{ matrix.os }}
    needs: [ci-gate]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2022]
        include:
          - os: ubuntu-22.04
            artifact_name: zenith-daw-linux
          - os: macos-13
            artifact_name: zenith-daw-macos
          - os: windows-2022
            artifact_name: zenith-daw-windows
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build \
          libasound2-dev libjack-jackd2-dev \
          libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxinerama-dev libxrandr-dev \
          libxcursor-dev libxcomposite-dev libxdamage-dev \
          libegl1-mesa-dev libgl1-mesa-dev \
          libvulkan-dev
    
    - name: Install Dependencies (macOS)
      if: matrix.os == 'macos-13'
      run: brew install cmake ninja
    
    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-2022'
      run: choco install ninja -y
    
    - name: Configure CMake (Release)
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DZENITH_BUILD_TESTS=OFF
    
    - name: Build Release
      run: cmake --build build --config Release
    
    - name: Package (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        cd build
        cpack -G DEB
        cpack -G TGZ
    
    - name: Package (macOS)
      if: matrix.os == 'macos-13'
      run: |
        cd build
        cpack -G DragNDrop
    
    - name: Package (Windows)
      if: matrix.os == 'windows-2022'
      run: |
        cd build
        cpack -G NSIS
    
    - name: Upload Release Assets
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: build/_packages/*
