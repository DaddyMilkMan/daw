name: CI

on:
  push:
    branches: [master, "zig-migration/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Zig build links ALSA, and the codec tests link libsndfile/libmpg123
      # by absolute versioned path (/lib/x86_64-linux-gnu/*). usrmerge makes
      # /lib -> /usr/lib on the runner, so the apt packages satisfy them.
      - name: Install audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libsndfile1 libmpg123-0

      - name: Set up Zig 0.14.1
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.1

      - name: Build & test
        run: zig build test
