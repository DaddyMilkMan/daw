name: Zenith DAW CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run full test suite daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # =============================================================================
  # BUILD & TEST - Ubuntu Linux (Primary Platform)
  # =============================================================================
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        compiler: [gcc-12, clang-15]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Setup Build Cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/vcpkg
          build/vcpkg_installed
          ~/.ccache
        key: ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-
          ${{ runner.os }}-${{ matrix.compiler }}-
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake ninja-build \
          libasound2-dev libjack-jackd2-dev \
          libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxinerama-dev libxrandr-dev \
          libxcursor-dev libxcomposite-dev libxdamage-dev \
          libegl1-mesa-dev libgl1-mesa-dev \
          libvulkan-dev vulkan-tools \
          ccache \
          python3 python3-pip
        
        # Install compiler
        if [ "${{ matrix.compiler }}" = "gcc-12" ]; then
          sudo apt-get install -y gcc-12 g++-12
          echo "CC=gcc-12" >> $GITHUB_ENV
          echo "CXX=g++-12" >> $GITHUB_ENV
        elif [ "${{ matrix.compiler }}" = "clang-15" ]; then
          sudo apt-get install -y clang-15 libc++-15-dev libc++abi-15-dev
          echo "CC=clang-15" >> $GITHUB_ENV
          echo "CXX=clang++-15" >> $GITHUB_ENV
        fi
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TESTS=ON \
          -DZENITH_ENABLE_WCET=ON \
          -DZENITH_ENABLE_COVERAGE=${{ matrix.build_type == 'Debug' && matrix.compiler == 'gcc-12' && 'ON' || 'OFF' }} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    
    - name: Build Application
      run: cmake --build build --target ZenithDAW -j$(nproc)
    
    - name: Build Tests
      run: cmake --build build --target ZenithDAWTests -j$(nproc)
    
    - name: Run Unit Tests
      run: |
        cd build
        ./ZenithDAWTests --gtest_output=json:test_results.json 2>&1 | tee test_output.log
      timeout-minutes: 10
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-linux-${{ matrix.compiler }}-${{ matrix.build_type }}
        path: |
          build/test_results.json
          build/test_output.log
    
    - name: Run Stress Tests (WCET)
      if: matrix.build_type == 'Release'
      run: |
        cd build
        ./WCETStressTests --duration 60 --json-output wcet_results.json
      timeout-minutes: 5
    
    - name: Upload WCET Results
      uses: actions/upload-artifact@v3
      if: matrix.build_type == 'Release'
      with:
        name: wcet-results-linux-${{ matrix.compiler }}
        path: build/wcet_results.json

  # =============================================================================
  # BUILD & TEST - macOS
  # =============================================================================
  build-macos:
    runs-on: macos-13
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Setup Build Cache
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Caches/vcpkg
          build/vcpkg_installed
          ~/Library/Caches/ccache
        key: ${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.build_type }}-
          ${{ runner.os }}-
    
    - name: Install Dependencies
      run: |
        brew install cmake ninja ccache
        pip3 install numpy
    
    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TESTS=ON \
          -DZENITH_ENABLE_WCET=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    
    - name: Build Application
      run: cmake --build build --target ZenithDAW
    
    - name: Build Tests
      run: cmake --build build --target ZenithDAWTests
    
    - name: Run Unit Tests
      run: |
        cd build
        ./ZenithDAWTests --gtest_output=json:test_results.json
      timeout-minutes: 10
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-macos-${{ matrix.build_type }}
        path: build/test_results.json

  # =============================================================================
  # BUILD & TEST - Windows
  # =============================================================================
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Setup Build Cache
      uses: actions/cache@v3
      with:
        path: |
          ~\AppData\Local\vcpkg
          build\vcpkg_installed
          C:\ProgramData\chocolatey\lib\ccache
        key: ${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.build_type }}-
          ${{ runner.os }}-
    
    - name: Install Dependencies
      run: |
        choco install ninja ccache -y
        pip install numpy
    
    - name: Configure CMake
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DBUILD_TESTS=ON `
          -DZENITH_ENABLE_WCET=ON `
          -DCMAKE_C_COMPILER_LAUNCHER=ccache `
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    
    - name: Build Application
      run: cmake --build build --target ZenithDAW
    
    - name: Build Tests
      run: cmake --build build --target ZenithDAWTests
    
    - name: Run Unit Tests
      run: |
        cd build
        .\ZenithDAWTests.exe --gtest_output=json:test_results.json
      timeout-minutes: 10
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-windows-${{ matrix.build_type }}
        path: build/test_results.json

  # =============================================================================
  # PERFORMANCE BENCHMARKS
  # =============================================================================
  performance-tests:
    runs-on: ubuntu-22.04
    needs: build-linux
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build \
          libasound2-dev libjack-jackd2-dev \
          libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxinerama-dev libxrandr-dev \
          libxcursor-dev libxcomposite-dev libxdamage-dev \
          libegl1-mesa-dev libgl1-mesa-dev \
          libvulkan-dev python3 python3-pip
    
    - name: Configure CMake (Release)
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DZENITH_ENABLE_WCET=ON
    
    - name: Build Performance Tests
      run: |
        cmake --build build --target MixerChannelBenchmark -j$(nproc)
        cmake --build build --target WavetableBenchmark -j$(nproc)
        cmake --build build --target SampleGeneratorBenchmarkApp -j$(nproc)
    
    - name: Run Mixer Channel Benchmark
      run: |
        cd build
        ./MixerChannelBenchmark --json-output mixer_benchmark.json
      timeout-minutes: 5
    
    - name: Run Wavetable Benchmark
      run: |
        cd build
        ./WavetableBenchmark --json-output wavetable_benchmark.json
      timeout-minutes: 5
    
    - name: Run Sample Generator Benchmark
      run: |
        cd build
        ./SampleGeneratorBenchmarkApp --json-output samplegen_benchmark.json
      timeout-minutes: 5
    
    - name: Upload Benchmark Results
      uses: actions/upload-artifact@v3
      with:
        name: performance-benchmarks
        path: |
          build/*_benchmark.json
    
    - name: Comment PR with Benchmark Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const mixerResults = JSON.parse(fs.readFileSync('build/mixer_benchmark.json', 'utf8'));
          
          const body = `## 📊 Performance Benchmark Results
          
          ### Mixer Channel Performance
          - Average processing time: ${mixerResults.avg_ms}ms
          - 99th percentile: ${mixerResults.p99_ms}ms
          - Samples processed: ${mixerResults.total_samples}
          
          *Benchmarks run on GitHub Actions Ubuntu 22.04 runner*
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  # =============================================================================
  # CODE COVERAGE
  # =============================================================================
  coverage:
    runs-on: ubuntu-22.04
    needs: build-linux
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build \
          libasound2-dev libjack-jackd2-dev \
          libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxinerama-dev libxrandr-dev \
          libxcursor-dev libxcomposite-dev libxdamage-dev \
          libegl1-mesa-dev libgl1-mesa-dev \
          libvulkan-dev lcov gcovr python3 python3-pip
    
    - name: Configure CMake (Debug with Coverage)
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DZENITH_ENABLE_COVERAGE=ON
    
    - name: Build with Coverage
      run: cmake --build build --target ZenithDAWTests -j$(nproc)
    
    - name: Run Tests with Coverage
      run: |
        cd build
        ./ZenithDAWTests
      timeout-minutes: 10
    
    - name: Generate Coverage Report
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/external/*' '*/tests/*' --output-file coverage.info
        lcov --list coverage.info
        genhtml coverage.info --output-directory coverage_report
    
    - name: Upload Coverage Report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: build/coverage_report
    
    - name: Upload to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: build/coverage.info
        fail_ci_if_error: true
        verbose: true

  # =============================================================================
  # SECURITY SCANNING
  # =============================================================================
  security-scan:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: cpp, python
        queries: security-extended,security-and-quality
    
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
    
    - name: Run Bandit (Python Security)
      run: |
        pip3 install bandit
        bandit -r backend/ -f json -o bandit-results.json || true
        bandit -r backend/ || true
    
    - name: Upload Security Results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-scan-results
        path: bandit-results.json

  # =============================================================================
  # TEST REPORT AGGREGATION
  # =============================================================================
  test-report:
    runs-on: ubuntu-22.04
    needs: [build-linux, build-macos, build-windows, performance-tests]
    if: always()
    
    steps:
    - name: Download All Test Artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts
    
    - name: Generate Test Summary
      run: |
        python3 << 'EOF'
        import json
        import os
        import glob
        from pathlib import Path
        
        summary = {
          "total_tests": 0,
          "passed": 0,
          "failed": 0,
          "platforms": {}
        }
        
        # Process test results
        for result_file in glob.glob("artifacts/**/test_results.json", recursive=True):
          platform = Path(result_file).parent.name
          try:
            with open(result_file, 'r') as f:
              data = json.load(f)
              
            for suite in data.get("testsuites", []):
              for test in suite.get("testsuite", []):
                summary["total_tests"] += 1
                if test.get("failures"):
                  summary["failed"] += 1
                else:
                  summary["passed"] += 1
            
            summary["platforms"][platform] = {
              "status": "success" if summary["failed"] == 0 else "failure"
            }
          except Exception as e:
            print(f"Error processing {result_file}: {e}")
        
        # Write summary
        with open("test_summary.json", "w") as f:
          json.dump(summary, f, indent=2)
        
        # Print summary
        print("=" * 60)
        print("TEST SUMMARY")
        print("=" * 60)
        print(f"Total Tests: {summary['total_tests']}")
        print(f"Passed: {summary['passed']}")
        print(f"Failed: {summary['failed']}")
        print(f"Success Rate: {(summary['passed'] / summary['total_tests'] * 100):.1f}%" if summary['total_tests'] > 0 else "N/A")
        print("=" * 60)
        for platform, status in summary["platforms"].items():
          emoji = "✅" if status["status"] == "success" else "❌"
          print(f"{emoji} {platform}")
        EOF
    
    - name: Upload Test Summary
      uses: actions/upload-artifact@v3
      with:
        name: test-summary
        path: test_summary.json
    
    - name: Comment PR with Test Summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('test_summary.json', 'utf8'));
          
          const passRate = summary.total_tests > 0 
            ? (summary.passed / summary.total_tests * 100).toFixed(1) 
            : 0;
          
          const body = `## 🧪 Test Results Summary
          
          | Metric | Value |
          |--------|-------|
          | Total Tests | ${summary.total_tests} |
          | ✅ Passed | ${summary.passed} |
          | ❌ Failed | ${summary.failed} |
          | Success Rate | ${passRate}% |
          
          **Platforms Tested:**
          ${Object.entries(summary.platforms).map(([p, s]) => 
            `- ${s.status === 'success' ? '✅' : '❌'} ${p}`
          ).join('\n')}
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  # =============================================================================
  # RELEASE BUILD
  # =============================================================================
  release:
    runs-on: ${{ matrix.os }}
    needs: [build-linux, build-macos, build-windows, test-report]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2022]
        include:
          - os: ubuntu-22.04
            artifact_name: zenith-daw-linux
          - os: macos-13
            artifact_name: zenith-daw-macos
          - os: windows-2022
            artifact_name: zenith-daw-windows
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build \
          libasound2-dev libjack-jackd2-dev \
          libfreetype6-dev libfontconfig1-dev \
          libx11-dev libxinerama-dev libxrandr-dev \
          libxcursor-dev libxcomposite-dev libxdamage-dev \
          libegl1-mesa-dev libgl1-mesa-dev \
          libvulkan-dev
    
    - name: Install Dependencies (macOS)
      if: matrix.os == 'macos-13'
      run: brew install cmake ninja
    
    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-2022'
      run: choco install ninja -y
    
    - name: Configure CMake (Release)
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=OFF
    
    - name: Build Release
      run: cmake --build build --config Release
    
    - name: Package (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        cd build
        cpack -G DEB
        cpack -G TGZ
    
    - name: Package (macOS)
      if: matrix.os == 'macos-13'
      run: |
        cd build
        cpack -G DragNDrop
    
    - name: Package (Windows)
      if: matrix.os == 'windows-2022'
      run: |
        cd build
        cpack -G NSIS
    
    - name: Upload Release Assets
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.artifact_name }}
        path: build/_packages/*
