name: TriageBot

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  triage:
    name: Automated Triage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          agents/TriageBot
        sparse-checkout-cone-mode: false
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        cd agents/TriageBot
        # Using only stdlib - no dependencies to install
        # pip install -r requirements.txt
        echo "No external dependencies required"
    
    - name: Run TriageBot
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        cd agents/TriageBot
        python3 run_triage.py
    
    - name: Upload triage log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: triage-log-${{ github.event.issue.number || github.event.pull_request.number }}
        path: agents/TriageBot/*.log
        if-no-files-found: ignore
