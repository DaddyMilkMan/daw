# =============================================================================
# ZENITH DAW - Include Hygiene Validation
# =============================================================================
# Ensures consistent include ordering and no unused includes
# =============================================================================

name: Include Hygiene

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-includes:
    name: Validate Include Statements
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run include fixer (check mode)
      run: |
        python3 scripts/fix-includes.py --check-only

  check-include-order:
    name: Check Include Ordering
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check include block order
      run: |
        echo "Checking include block ordering..."
        echo ""
        
        # Expected order:
        # 1. Corresponding header (for .cpp)
        # 2. Project headers (zenith_*)
        # 3. JUCE headers (juce_*)
        # 4. System headers (<...>)
        
        violations=0
        
        for file in $(find modules -name "*.cpp" | head -20); do
          # Check if corresponding header is first
          basename=$(basename "$file" .cpp)
          dir=$(dirname "$file")
          
          # Get first include
          first_include=$(grep -m 1 "^#include" "$file" 2>/dev/null || true)
          
          # For .cpp files, first include should often be corresponding header
          if [ -f "$dir/$basename.h" ]; then
            if ! echo "$first_include" | grep -q "$basename.h"; then
              echo "⚠️  $file: First include should be corresponding header"
              echo "    Current: $first_include"
              ((violations++))
            fi
          fi
        done
        
        if [ $violations -eq 0 ]; then
          echo "✅ Include ordering looks good"
        else
          echo ""
          echo "$violations potential ordering issues found"
        fi

  check-circular-includes:
    name: Check for Circular Includes
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Basic circular include check
      run: |
        echo "Checking for potential circular includes..."
        echo ""
        
        # This is a simplified check - full detection would need compilation
        # Look for bidirectional includes
        
        issues=0
        
        # Check each header for includes that might reference back
        for header in $(find modules -name "*.h" | head -50); do
          basename=$(basename "$header")
          
          # Get includes from this header
          includes=$(grep "#include" "$header" 2>/dev/null | grep "zenith_" || true)
          
          if [ -n "$includes" ]; then
            # Check if any included file includes this one back
            while IFS= read -r include_line; do
              # Extract filename from include
              included_file=$(echo "$include_line" | sed 's/.*\///; s/>.*//; s/".*//')
              
              # Find that file
              included_path=$(find modules -name "$included_file" | head -1)
              
              if [ -n "$included_path" ] && [ -f "$included_path" ]; then
                # Check if it includes us back
                if grep -q "#include.*$basename" "$included_path" 2>/dev/null; then
                  echo "⚠️  Potential circular include:"
                  echo "    $basename → $included_file"
                  echo "    $included_file → $basename"
                  ((issues++))
                fi
              fi
            done <<< "$includes"
          fi
        done
        
        if [ $issues -eq 0 ]; then
          echo "✅ No obvious circular includes detected"
        else
          echo ""
          echo "Found $issues potential circular include patterns"
          echo "Review and consider forward declarations"
        fi

  check-unused-includes:
    name: Check for Unused Includes
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Basic unused include check
      run: |
        echo "Checking for potentially unused includes..."
        echo "(This is a heuristic check)"
        echo ""
        
        # This is complex to do accurately without full parsing
        # We'll do a simple check: includes where the header name doesn't
        # appear in class names in the file
        
        for file in $(find modules -name "*.cpp" | head -10); do
          # Skip for now - this requires more sophisticated analysis
          :
        done
        
        echo "✅ Unused include detection requires compilation"
        echo "   Consider using clang-tidy for accurate detection:"
        echo "   clang-tidy -checks='misc-include-cleaner'"
