# =============================================================================
# ZENITH DAW - Test Discovery Validation
# =============================================================================
# Ensures tests are discoverable and properly organized
# =============================================================================

name: Test Discovery

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  check-test-structure:
    name: Check Test Structure
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify mirrored test structure
      run: |
        echo "Checking test directory structure..."
        echo ""
        
        for module in zenith_core zenith_ui zenith_dsp zenith_network zenith_commands; do
          if [ -d "modules/$module/tests" ]; then
            test_count=$(find "modules/$module/tests" -name "*.cpp" | wc -l)
            echo "✅ modules/$module/tests/ ($test_count test files)"
          else
            echo "⚠️  modules/$module/tests/ (does not exist)"
          fi
        done

    - name: Check test naming conventions
      run: |
        echo ""
        echo "Checking test naming conventions..."
        echo ""
        
        # Tests should follow: [Component]_[Scenario]_[ExpectedResult]
        # or be in [Component]Test.cpp files
        
        violations=$(find modules -path "*/tests/*.cpp" | \
                     xargs grep -l "^TEST(" | \
                     xargs grep "^TEST(" | \
                     grep -v "TEST([A-Za-z]" || true)
        
        if [ -n "$violations" ]; then
          echo "⚠️  Some test names don't follow PascalCase convention"
          echo "$violations" | head -10
        else
          echo "✅ Test naming looks good"
        fi

  check-source-test-pairs:
    name: Check Source/Test Pairs
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Find untested components
      run: |
        echo "Checking for components without tests..."
        echo ""
        
        untested=0
        
        # Check core components
        for header in $(find modules/zenith_core/engine -name "*.h" | head -20); do
          basename=$(basename "$header" .h)
          
          # Look for corresponding test
          if ! find modules/zenith_core/tests -name "*$basename*" | grep -q .; then
            echo "⚠️  No test found for: $header"
            ((untested++))
          fi
        done
        
        if [ $untested -eq 0 ]; then
          echo "✅ Core components appear to have tests"
        else
          echo ""
          echo "$untested components may need tests"
        fi

  validate-test-build:
    name: Validate Test Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build

    - name: Configure with tests
      run: |
        cmake -S . -B build -G Ninja \
          -DBUILD_TESTS=ON \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build tests
      run: |
        cmake --build build --target ZenithTests -j$(nproc)

    - name: Run tests
      run: |
        ctest --test-dir build --output-on-failure -j$(nproc)
