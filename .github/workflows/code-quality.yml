name: Code Quality

on:
  push:
    branches: [ master, main, work/* ]
  pull_request:
    branches: [ master, main, work/* ]

jobs:
  # Static analysis
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang clang-format clang-tidy

    - name: Run clang-format
      run: |
        find apps/desktop/ -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" -o -name "*.cxx" | xargs -I {} clang-format -style=file -Werror {}

    - name: Run clang-tidy
      run: |
        cd build
        cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..
        make clang-tidy

    - name: Run Cppcheck
      run: |
        sudo apt-get install -y cppcheck
        cppcheck \
          --enable=all \
          --max-depth=16 \
          --inconclusive \
          --suppress=missingIncludeSystem \
          --inline-suppr \
          --quiet \
          apps/desktop/

  # Code formatting
  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Black
      run: |
        pip install black==23.3.0

    - name: Run Black formatter
      run: |
        black --check --diff apps/desktop/ tests/

    - name: Run Clang Format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format
        find apps/desktop/ -name "*.cpp" -o -name "*.h" -o -name "*.hpp" | xargs clang-format --dry-run --Werror

  # Linting
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install linters
      run: |
        pip install flake8 pycodestyle pylint bandit

    - name: Run Python linting
      run: |
        flake8 apps/desktop/ --exclude=.git,build,__pycache__
        pycodestyle apps/desktop/
        pylint apps/desktop/ --disable=C0103,C0114,C0115,C0116,R0903,R0913,R0914,R0915,W0703

    - name: Run security linting
      run: |
        bandit -r apps/desktop/

  # Documentation checks
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Doxygen
      run: |
        sudo apt-get install -y doxygen graphviz

    - name: Validate Doxygen configuration
      run: |
        doxygen -g Doxyfile
        doxygen Doxyfile

    - name: Check documentation links
      run: |
        pip install markdown-link-check
        markdown-link-check docs/

  # Complexity analysis
  complexity:
    name: Code Complexity
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install complexity tools
      run: |
        pip install radon lizard

    - name: Run radon analysis
      run: |
        radon cc apps/desktop/ -nb -a -nb
        radon mi apps/desktop/ -nb -nb
        radon cc apps/desktop/ -nb -a

    - name: Run lizard analysis
      run: |
        lizard apps/desktop/ -l cpp -t 30 --ignore_warnings 2000

  # Duplicate code detection
  duplicates:
    name: Duplicate Code
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install duplicate detection tools
      run: |
        sudo apt-get install -y jdupes

    - name: Run duplicate detection
      run: |
        jdupes -r apps/desktop/

  # Code review checklist
  review-checklist:
    name: Code Review Checklist
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run checklist
      run: |
        echo "## Code Review Checklist" >> $GITHUB_STEP_SUMMARY
        echo "### General" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Code follows project coding standards" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] No hardcoded paths or credentials" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Error handling is comprehensive" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Logging is appropriate" >> $GITHUB_STEP_SUMMARY
        echo "### Performance" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] No unnecessary allocations" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Algorithms are efficient" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Memory usage is reasonable" >> $GITHUB_STEP_SUMMARY
        echo "### Security" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Input validation is present" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Buffer sizes are checked" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] No use of unsafe functions" >> $GITHUB_STEP_SUMMARY
        echo "### Testing" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Unit tests added for new features" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Integration tests updated if needed" >> $GITHUB_STEP_SUMMARY
        echo "- [ ] Performance benchmarks added if needed" >> $GITHUB_STEP_SUMMARY

  # Quality report
  quality-report:
    name: Quality Report
    runs-on: ubuntu-latest
    needs: [static-analysis, formatting, linting, documentation, complexity, duplicates, review-checklist]
    if: always()
    steps:
    - name: Generate quality report
      run: |
        echo "## Code Quality Report" >> $GITHUB_STEP_SUMMARY
        echo "### Static Analysis: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Code Formatting: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Linting: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Documentation: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Complexity Analysis: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Duplicate Detection: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Review Checklist: ✅" >> $GITHUB_STEP_SUMMARY