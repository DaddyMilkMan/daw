name: Security Scanning

on:
  push:
    branches: [ master, main, work/* ]
  pull_request:
    branches: [ master, main, work/* ]
  schedule:
    # Run security scans weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  # GitHub Dependabot Security Scan
  dependabot:
    name: Dependabot Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Dependabot security audit
      uses: actions/checkout@v3
      with:
        persist-credentials: false

  # CodeQL Security Analysis
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Checkout dependencies
      uses: actions/checkout@v3
      with:
        path: 'external'
        repository: 'juce-framework/JUCE'
        ref: 'latest'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
        databases: ${{ matrix.database }}

    - name: Perform Security Analysis
      uses: github/codeql-action/perform-analysis@v2
      with:
        languages: ${{ matrix.language }}
        queries: ${{ matrix.queries }}
        category: security

    - name: Perform Vulnerability Analysis
      uses: github/codeql-action/perform-analysis@v2
      with:
        languages: ${{ matrix.language }}
        queries: ${{ matrix.vulnerability_queries }}
        category: security

  # Dependency vulnerability scanning
  dependency-scanning:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install safety
      run: pip install safety

    - name: Run safety check
      run: safety check -r requirements.txt

    - name: Install bandit
      run: pip install bandit

    - name: Run bandit security scan
      run: bandit -r apps/desktop/ -f json -o bandit-report.json

    - name: Upload bandit report
      uses: actions/upload-artifact@v3
      with:
        name: bandit-report
        path: bandit-report.json
        retention-days: 90

  # Trivy vulnerability scanner
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.19'

    - name: Install Trivy
      run: |
        go install github.com/aquasecurity/trivy/cmd/trivy@latest

    - name: Run Trivy vulnerability scan
      run: |
        trivy fs --scanners vuln,config,secret --exit-code 1 --format json --output trivy-report.json .

    - name: Upload Trivy report
      uses: actions/upload-artifact@v3
      with:
        name: trivy-report
        path: trivy-report.json
        retention-days: 90

  # Snyk vulnerability scanning
  snyk-scan:
    name: Snyk Vulnerability Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Snyk CLI
      run: npm install -g snyk

    - name: Run Snyk vulnerability scan
      run: snyk test --json --all-projects > snyk-report.json

    - name: Run Snyk code analysis
      run: snyk code test --all-projects > snyk-code-report.json

    - name: Upload Snyk reports
      uses: actions/upload-artifact@v3
      with:
        name: snyk-reports
        path: |
          snyk-report.json
          snyk-code-report.json
        retention-days: 90

  # OWASP Dependency Check
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Run OWASP Dependency Check
      run: |
        curl -s -L https://github.com/jeremylong/DependencyCheck/releases/download/v8.2.1/dependency-check-8.2.1-release.zip -o dependency-check.zip
        unzip dependency-check.zip
        ./dependency-check/bin/dependency-check \
          --project "Zenith DAW" \
          --scan apps/desktop/ \
          --format HTML \
          --out owasp-report/

    - name: Upload OWASP report
      uses: actions/upload-artifact@v3
      with:
        name: owasp-report
        path: owasp-report/
        retention-days: 90

  # Secret scanning
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install truffleHog
      run: |
        pip install trufflehog

    - name: Scan for secrets
      run: trufflehog --regex --entropy=False --rules trufflehog_rules.json .

    - name: Install git-secrets
      run: |
        sudo apt-get update
        sudo apt-get install -y git-secrets
        git secrets --install

    - name: Configure git-secrets
      run: |
        git secrets --add --literal 'AKIA[0-9A-Z]{16}'
        git secrets --add --literal '[A-Za-z0-9/+]{40}'
        git secrets --add --literal --glob '!**/.git/**'
        git secrets --scan

  # Security report
  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [dependabot, codeql, dependency-scanning, trivy-scan, snyk-scan, owasp-dependency-check, secret-scanning]
    if: always()
    steps:
    - name: Generate security summary
      run: |
        echo "## Security Scanning Summary" >> $GITHUB_STEP_SUMMARY
        echo "### Dependabot: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### CodeQL: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Dependency Scanning: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Trivy: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Snyk: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### OWASP: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Secret Scanning: ✅" >> $GITHUB_STEP_SUMMARY