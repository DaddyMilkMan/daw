name: Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    # Run full test suite weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  # Unit Tests
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [gcc, clang]
        exclude:
          - os: windows-latest
            compiler: gcc
          - os: macos-latest
            compiler: gcc

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup dependencies
      uses: ./.github/actions/setup-dependencies
      with:
        os: ${{ matrix.os }}

    - name: Configure CMake
      run: |
        cmake -B build -S apps/desktop \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DBUILD_UNIT_TESTS=ON \
          -DBUILD_INTEGRATION_TESTS=OFF \
          -DBUILD_PERFORMANCE_TESTS=OFF

    - name: Build unit tests
      run: cmake --build build --target unit_tests

    - name: Run unit tests
      run: ctest --output-on-failure -R "unit_*" --build-config Debug -C Debug

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: unit-test-results-${{ matrix.os }}-${{ matrix.compiler }}
        path: build/TestResults/
        retention-days: 30

  # Integration Tests
  integration-tests:
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        test-suite:
          - audio-engine
          - midi-system
          - plugin-host
          - project-io
          - automation

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup dependencies
      uses: ./.github/actions/setup-dependencies
      with:
        os: ${{ matrix.os }}

    - name: Configure CMake
      run: |
        cmake -B build -S apps/desktop \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DBUILD_UNIT_TESTS=OFF \
          -DBUILD_INTEGRATION_TESTS=ON \
          -DBUILD_PERFORMANCE_TESTS=OFF

    - name: Build integration tests
      run: cmake --build build --target integration_tests

    - name: Run integration tests
      run: |
        ctest --output-on-failure --timeout 300 -R "${{ matrix.test-suite }}_*" --build-config Debug -C Debug

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: integration-test-results-${{ matrix.os }}-${{ matrix.test-suite }}
        path: build/TestResults/
        retention-days: 30

  # Performance Tests
  performance-tests:
    name: Performance Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        test: [latency, throughput, memory]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup dependencies
      uses: ./.github/actions/setup-dependencies
      with:
        os: ${{ matrix.os }}

    - name: Configure CMake
      run: |
        cmake -B build -S apps/desktop \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DBUILD_UNIT_TESTS=OFF \
          -DBUILD_INTEGRATION_TESTS=OFF \
          -DBUILD_PERFORMANCE_TESTS=ON

    - name: Build performance tests
      run: cmake --build build --target performance_tests

    - name: Run performance tests
      run: |
        ctest --output-on-failure --timeout 600 -R "performance_${{ matrix.test }}*" --build-config Release -C Release

    - name: Performance baseline check
      run: |
        if [ -f "scripts/performance/baseline_${{ matrix.test }}.json" ]; then
          python scripts/performance/check_baseline.py ${{ matrix.test }} build/TestResults/performance_${{ matrix.test }}.json
        fi

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results-${{ matrix.os }}-${{ matrix.test }}
        path: build/TestResults/
        retention-days: 90

  # Fuzz Tests
  fuzz-tests:
    name: Fuzz Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup dependencies
      uses: ./.github/actions/setup-dependencies
      with:
        os: ubuntu-latest

    - name: Configure CMake with fuzzing
      run: |
        cmake -B build -S apps/desktop \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DBUILD_UNIT_TESTS=OFF \
          -DBUILD_INTEGRATION_TESTS=OFF \
          -DBUILD_PERFORMANCE_TESTS=OFF \
          -DBUILD_FUZZ_TESTS=ON \
          -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer,address,undefined" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=fuzzer,address,undefined"

    - name: Build fuzz tests
      run: cmake --build build --target fuzz_tests

    - name: Run fuzz tests
      run: |
        ctest --output-on-failure --timeout 1200 -R "fuzz_*" --build-config Debug -C Debug

    - name: Upload fuzz results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: fuzz-test-results
        path: build/TestResults/
        retention-days: 30

  # Stress Tests
  stress-tests:
    name: Stress Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup dependencies
      uses: ./.github/actions/setup-dependencies
      with:
        os: ubuntu-latest

    - name: Configure CMake
      run: |
        cmake -B build -S apps/desktop \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DBUILD_UNIT_TESTS=OFF \
          -DBUILD_INTEGRATION_TESTS=OFF \
          -DBUILD_PERFORMANCE_TESTS=OFF \
          -DBUILD_STRESS_TESTS=ON

    - name: Build stress tests
      run: cmake --build build --target stress_tests

    - name: Run stress tests
      run: |
        ctest --output-on-failure --timeout 1800 -R "stress_*" --build-config Release -C Release

    - name: Generate stress test report
      run: |
        python scripts/stress/generate_report.py build/TestResults/stress_*.json

    - name: Upload stress results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stress-test-results
        path: build/TestResults/ scripts/stress/report.html
        retention-days: 90

  # Test Coverage
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup dependencies
      uses: ./.github/actions/setup-dependencies
      with:
        os: ubuntu-latest

    - name: Install coverage tools
      run: |
        sudo apt-get install -y lcov

    - name: Configure CMake with coverage
      run: |
        cmake -B build -S apps/desktop \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTS=ON \
          -DBUILD_UNIT_TESTS=ON \
          -DBUILD_INTEGRATION_TESTS=ON \
          -DCMAKE_CXX_FLAGS="--coverage" \
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

    - name: Build with coverage
      run: cmake --build build --config Debug -C Debug

    - name: Run tests with coverage
      run: |
        ctest --output-on-failure --build-config Debug -C Debug
        lcov --capture --directory build --output-file coverage.info

    - name: Generate coverage report
      run: |
        genhtml coverage.info --output-directory coverage_report

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.info
        fail_ci_if_error: true
        verbose: true

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage_report/
        retention-days: 90