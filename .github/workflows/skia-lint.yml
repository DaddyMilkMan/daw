name: Skia Lint

on:
  pull_request:
    paths:
      - 'apps/desktop/Source/ui/**'

jobs:
  lint-no-juce-graphics:
    name: Check for juce::Graphics usage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run juce::Graphics linter
        run: ./scripts/lint-no-juce-graphics.sh
