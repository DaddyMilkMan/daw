name: Maintenance

on:
  schedule:
    # Run on the first day of every month at 3:00 AM UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:

jobs:
  # Update dependencies
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Renovate
      run: npm install -g @renovatebot/cli

    - name: Configure Renovate
      run: |
        cat > renovate.json << EOF
        {
          "extends": [
            "config:base"
          ],
          "schedule": "on the first day of the month",
          "prConcurrentLimit": 10,
          "prHourlyLimit": 2,
          "rangeStrategy": "auto",
          "automerge": true,
          "platformAutomerge": true
        }
        EOF

    - name: Run Renovate
      run: renovate

  # Clean up old artifacts
  cleanup-artifacts:
    name: Clean Up Old Artifacts
    runs-on: ubuntu-latest
    steps:
    - name: Delete old artifacts
      uses: actions/github-script@v6
      with:
        script: |
          const olderThan = 30; // days
          const cutoff = new Date();
          cutoff.setDate(cutoff.getDate() - olderThan);

          const artifacts = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });

          for (const artifact of artifacts.data.artifacts) {
            const createdAt = new Date(artifact.created_at);
            if (createdAt < cutoff) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              console.log(`Deleted artifact ${artifact.id}: ${artifact.name}`);
            }
          }

  # Update GitHub Actions
  update-actions:
    name: Update GitHub Actions
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install action-updater
      run: pip install action-updater

    - name: Update actions
      run: |
        action-updater --verbose

  # Maintenance report
  maintenance-report:
    name: Maintenance Report
    runs-on: ubuntu-latest
    needs: [update-dependencies, cleanup-artifacts, update-actions]
    steps:
    - name: Generate maintenance report
      run: |
        echo "## Maintenance Report - $(date)" >> $GITHUB_STEP_SUMMARY
        echo "### Dependencies: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### Artifacts Cleanup: ✅" >> $GITHUB_STEP_SUMMARY
        echo "### GitHub Actions: ✅" >> $GITHUB_STEP_SUMMARY