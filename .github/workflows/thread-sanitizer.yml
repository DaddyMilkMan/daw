name: ThreadSanitizer - Data Race Detection

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly at 2 AM UTC (tsan is slow, don't run on every push)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: 'Test timeout in minutes'
        required: false
        default: '30'

jobs:
  thread-sanitizer-linux:
    name: ThreadSanitizer on Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          clang \
          cmake \
          ninja-build \
          libasound2-dev \
          libjack-jackd2-dev \
          libfreetype6-dev \
          libx11-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxcomposite-dev \
          mesa-common-dev \
          libgl1-mesa-dev \
          libcurl4-openssl-dev \
          libwebkit2gtk-4.0-dev
    
    - name: Configure with ThreadSanitizer
      run: |
        mkdir -p build-tsan
        cd build-tsan
        export CC=clang
        export CXX=clang++
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
          -DCMAKE_C_FLAGS="-fsanitize=thread -g -O1" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread" \
          -DBUILD_TESTS=ON \
          -DZENITH_ENABLE_SKIA=OFF \
          -DCMAKE_PREFIX_PATH=/usr/lib/llvm-$(clang --version | grep -oP '\d+\.\d+' | head -1)/lib/cmake
    
    - name: Build tests
      run: |
        cd build-tsan
        ninja ZenithDAWTests 2>&1 | tee build.log
      timeout-minutes: 30
    
    - name: Run tests with ThreadSanitizer
      run: |
        cd build-tsan
        export TSAN_OPTIONS="\
          detect_deadlocks=1 \
          halt_on_error=1 \
          history_size=7 \
          second_deadlock_stack=1 \
          print_stats=1 \
          log_path=tsan_report"
        
        timeout ${{ github.event.inputs.timeout_minutes || 15 }}m \
          ./ZenithDAWTests_artefacts/Debug/ZenithDAWTests \
          2>&1 | tee tsan_output.log || true
      timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '15') }}
    
    - name: Check for TSan errors
      run: |
        cd build-tsan
        if grep -q "ERROR: ThreadSanitizer" tsan_output.log; then
          echo "❌ ThreadSanitizer found errors!"
          grep -A 20 "ERROR: ThreadSanitizer" tsan_output.log | head -50
          exit 1
        elif grep -q "WARNING: ThreadSanitizer" tsan_output.log; then
          echo "⚠️ ThreadSanitizer found warnings"
          grep -A 10 "WARNING: ThreadSanitizer" tsan_output.log | head -30
          # Don't fail on warnings, just report them
        else
          echo "✅ No ThreadSanitizer errors detected"
        fi
    
    - name: Upload TSan reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tsan-reports
        path: |
          build-tsan/tsan_output.log
          build-tsan/tsan_report*
          build-tsan/build.log
        if-no-files-found: ignore
    
    - name: Summary
      if: always()
      run: |
        echo "=== ThreadSanitizer Summary ==="
        echo "Build: ${{ job.status == 'success' && '✅' || '❌' }}"
        echo "Test execution: Complete"
        echo "See uploaded artifacts for detailed reports"
