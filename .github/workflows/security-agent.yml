name: Security Agent

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.x
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run Security Agent
      run: |
        cd agents/SecurityAgent
        python3 security_agent.py --scan-dir ../../ --output ci
      continue-on-error: true
      id: security-scan

    - name: Display Security Summary
      if: always()
      run: |
        echo "Security scan completed. Check the logs above for details."
        if [ "${{ steps.security-scan.outcome }}" == "failure" ]; then
          echo "⚠️ Security issues found. Please review the findings above."
          exit 1
        else
          echo "✅ No critical security issues detected."
        fi
