name: build (windows)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, "claude/**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ dev-debug, release-safe ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Ensure Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure (${{ matrix.preset }})
        shell: bash
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }} -j

      # Guardrails: flags must match expectations per preset
      - name: Verify flags (${{ matrix.preset }})
        shell: pwsh
        run: |
          $cache = Get-Content "out/build/${{ matrix.preset }}/CMakeCache.txt"
          if ("${{ matrix.preset }}" -eq "release-safe") {
            if ($cache -notmatch 'ZENITH_ENABLE_PHASE1_AUDIO:BOOL=OFF') { throw "Engine flag should be OFF in release-safe" }
            if ($cache -notmatch 'ZENITH_ENABLE_CRASH_CAPTURE:BOOL=OFF') { throw "Crash flag should be OFF in release-safe" }
          } else {
            if ($cache -notmatch 'ZENITH_ENABLE_PHASE1_AUDIO:BOOL=ON')  { throw "Engine flag should be ON in dev-debug" }
          }

      # Extra guard: CrashCapture objects must NOT exist when flag is OFF
      - name: Verify no CrashCapture objects (release-safe only)
        if: matrix.preset == 'release-safe'
        shell: pwsh
        run: |
          $hits = Get-ChildItem -Recurse "out/build/${{ matrix.preset }}" -Include *CrashCapture*.obj, *Crashpad*.obj, *Crashpad*.lib -ErrorAction SilentlyContinue
          if ($hits) { $hits | % FullName; throw "Crash artifacts present with flag OFF." }

      - name: Upload artifacts (${{ matrix.preset }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenith-${{ matrix.preset }}-${{ github.sha }}
          path: |
            out/build/${{ matrix.preset }}/**/*.exe
            out/build/${{ matrix.preset }}/**/*.dll
            out/build/${{ matrix.preset }}/**/*.pdb
          if-no-files-found: ignore
