name: WCET Analysis - Worst-Case Execution Time

on:
  push:
    branches: [ main, develop, claude/** ]
    paths:
      - 'apps/desktop/Source/engine/**'
      - 'apps/desktop/Source/dsp/**'
      - 'apps/desktop/Source/instruments/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/desktop/Source/engine/**'
      - 'apps/desktop/Source/dsp/**'
      - 'apps/desktop/Source/instruments/**'
  workflow_dispatch:
    inputs:
      stress_duration:
        description: 'Stress test duration in seconds'
        required: false
        default: '60'
      max_tracks:
        description: 'Maximum tracks to test'
        required: false
        default: '50'

jobs:
  wcet-analysis-linux:
    name: WCET Analysis on Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          libasound2-dev \
          libjack-jackd2-dev \
          libfreetype6-dev \
          libx11-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxcomposite-dev \
          mesa-common-dev \
          libgl1-mesa-dev \
          libcurl4-openssl-dev \
          libwebkit2gtk-4.0-dev
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DZENITH_ENABLE_WCET=ON
    
    - name: Build WCET tests
      run: |
        cd build
        ninja WCETStressTests
      timeout-minutes: 15
    
    - name: Run WCET stress test
      run: |
        cd build
        ./ZenithDAWTests_artefacts/Release/WCETStressTests \
          --duration ${{ github.event.inputs.stress_duration || 30 }} \
          --max-tracks ${{ github.event.inputs.max_tracks || 30 }} \
          --report-file wcet_report.json
      timeout-minutes: 5
    
    - name: Analyze WCET results
      run: |
        cd build
        python3 << 'EOF'
        import json
        import sys
        
        try:
            with open('wcet_report.json', 'r') as f:
                report = json.load(f)
            
            print("=== WCET Analysis Results ===")
            print(f"Test Duration: {report.get('testDuration', 'N/A')}s")
            print(f"Total Callbacks: {report.get('totalCallbacks', 0)}")
            print(f"Sample Rate: {report.get('sampleRate', 0)} Hz")
            print(f"Buffer Size: {report.get('bufferSize', 0)} samples")
            print(f"Time Budget: {report.get('budgetMs', 0):.2f} ms")
            print()
            
            stats = report.get('statistics', {})
            print("Execution Times:")
            print(f"  Average: {stats.get('avgExecutionTimeUs', 0):.2f} us")
            print(f"  Worst Case: {stats.get('maxExecutionTimeUs', 0):.2f} us")
            print(f"  Best Case: {stats.get('minExecutionTimeUs', 0):.2f} us")
            print()
            
            budget_ms = report.get('budgetMs', 5.0)
            max_us = stats.get('maxExecutionTimeUs', 0)
            utilization = (max_us / 1000.0) / budget_ms * 100.0
            
            print(f"Budget Utilization: {utilization:.1f}%")
            print(f"Overruns: {stats.get('overruns', 0)}")
            print(f"Consecutive Overruns: {stats.get('consecutiveOverruns', 0)}")
            print()
            
            # Determine pass/fail
            passed = True
            
            if utilization > 95.0:
                print("❌ FAIL: Budget utilization > 95% - Xruns likely!")
                passed = False
            elif utilization > 80.0:
                print("⚠️ WARNING: Budget utilization > 80% - Monitor closely")
            else:
                print("✅ Budget utilization healthy")
            
            if stats.get('overruns', 0) > 0:
                print(f"❌ FAIL: {stats.get('overruns', 0)} overruns detected!")
                passed = False
            
            if stats.get('consecutiveOverruns', 0) > 0:
                print(f"❌ FAIL: {stats.get('consecutiveOverruns', 0)} consecutive overruns!")
                passed = False
            
            print()
            if passed:
                print("✅ WCET Analysis PASSED")
                sys.exit(0)
            else:
                print("❌ WCET Analysis FAILED")
                sys.exit(1)
                
        except FileNotFoundError:
            print("❌ WCET report file not found")
            sys.exit(1)
        except json.JSONDecodeError as e:
            print(f"❌ Failed to parse WCET report: {e}")
            sys.exit(1)
        EOF
    
    - name: Upload WCET reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: wcet-reports
        path: |
          build/wcet_report.json
        if-no-files-found: ignore
    
    - name: Comment PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = 'build/wcet_report.json';
          
          if (!fs.existsSync(path)) {
            return;
          }
          
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const stats = report.statistics || {};
          const utilization = ((stats.maxExecutionTimeUs || 0) / 1000.0 / (report.budgetMs || 5.0)) * 100;
          
          const status = utilization > 95 ? '❌ FAIL' : utilization > 80 ? '⚠️ WARNING' : '✅ PASS';
          
          const body = `## WCET Analysis Results
          
          **Status:** ${status}
          
          | Metric | Value |
          |--------|-------|
          | Average Execution | ${(stats.avgExecutionTimeUs || 0).toFixed(2)} us |
          | Worst-Case Execution | ${(stats.maxExecutionTimeUs || 0).toFixed(2)} us |
          | Budget | ${(report.budgetMs || 0).toFixed(2)} ms |
          | Utilization | ${utilization.toFixed(1)}% |
          | Overruns | ${stats.overruns || 0} |
          
          ${utilization > 95 ? '⚠️ **High utilization detected - potential xrun risk**' : ''}
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
