name: Multi-Platform Builds

on:
  push:
    branches: [ master, main, work/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main, work/* ]

jobs:
  # Linux build
  build-linux:
    name: Linux Build (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        build_type: [Debug, Release, RelWithDebInfo]
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx_compiler: g++
          - os: ubuntu-latest
            compiler: clang
            cxx_compiler: clang++

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/CMake
          ~/.cache/pip
          build-deps
        key: ${{ runner.os }}-deps-${{ matrix.build_type }}-${{ hashFiles('**/requirements.txt', '**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps-
          ${{ runner.os }}-deps-${{ matrix.build_type }}-

    - name: Install system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          libasound2-dev \
          libpulse-dev \
          libjack-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxext-dev \
          libxrender-dev \
          libxcomposite-dev \
          libxtst-dev \
          libxss1 \
          libgtk-3-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libasound2-dev \
          libpulse-dev \
          libcurl4-openssl-dev \
          libsamplerate0-dev \
          librubberband-dev \
          libfftw3-dev \
          libsphinxbase-dev \
          libglib2.0-dev \
          libgconf-2.4-dev \
          libdbus-1-dev \
          libssl-dev \
          libffi-dev \
          libgirepository1.0-dev

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p build
        cd build
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=${{ matrix.compiler }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }} \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DCMAKE_CXX_EXTENSIONS=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=OFF \
          -DBENCHMARK_ENABLE=OFF \
          ..

    - name: Build project
      working-directory: ${{github.workspace}}/build
      run: ninja -j$(nproc)

    - name: Run tests
      working-directory: ${{github.workspace}}/build
      run: ninja test

    - name: Package Linux
      working-directory: ${{github.workspace}}/build
      run: |
        cpack -G TGZ

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-${{ matrix.build_type }}
        path: |
          build/*.tar.gz
          build/*.deb
        retention-days: 90

  # macOS build
  build-macos:
    name: macOS Build (${{ matrix.build_type }})
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        include:
          - build_type: Debug
            xcode_configuration: Debug
          - build_type: Release
            xcode_configuration: Release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/CMake
          ~/Library/Caches/Homebrew
          build-deps
        key: ${{ runner.os }}-deps-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps-
          ${{ runner.os }}-deps-${{ matrix.build_type }}-

    - name: Install macOS dependencies
      run: |
        brew update
        brew install ninja cmake \
          pkgconfig \
          libtool \
          gettext \
          coreutils \
          wget \
          curl \
          libpng \
          libjpeg \
          librsvg \
          libtiff \
          libvorbis \
          libogg \
          flac \
          libsndfile \
          portaudio \
          jack \
          fftw \
          libsamplerate \
          rubberband

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p build
        cd build
        cmake -G "Unix Makefiles" \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DCMAKE_CXX_EXTENSIONS=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DBUILD_TESTS=ON \
          -DBUILD_EXAMPLES=OFF \
          -DBENCHMARK_ENABLE=OFF \
          ..

    - name: Build project
      working-directory: ${{github.workspace}}/build
      run: make -j$(sysctl -n hw.ncpu)

    - name: Run tests
      working-directory: ${{github.workspace}}/build
      run: make test

    - name: Package macOS
      working-directory: ${{github.workspace}}/build
      run: |
        cpack -G ZIP

    - name: Upload macOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-${{ matrix.build_type }}
        path: |
          build/*.zip
        retention-days: 90

  # Windows build
  build-windows:
    name: Windows Build (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        architecture: [x64, x86]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          C:\Users\runneradmin\AppData\Local\CMake
          C:\ProgramData\chocolatey\lib\*
          build-deps
        key: ${{ runner.os }}-deps-${{ matrix.build_type }}-${{ matrix.architecture }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-deps-
          ${{ runner.os }}-deps-${{ matrix.build_type }}
          ${{ runner.os }}-deps-${{ matrix.build_type }}-${{ matrix.architecture }}

    - name: Install Windows dependencies
      run: |
        choco install -y ninja cmake
        # Bootstrap vcpkg
        if (Test-Path "vcpkg") { Remove-Item -Recurse -Force "vcpkg" }
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg install --triplet=x64-windows \
          asio \
          boost \
          fftw3 \
          libjpeg-turbo \
          libpng \
          libsamplerate \
          libsndfile \
          libvorbis \
          opengl \
          portaudio \
          zlib

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        mkdir -p build
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 ^
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ^
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake ^
          -DBUILD_SHARED_LIBS=OFF ^
          -DBUILD_TESTS=ON ^
          -DBUILD_EXAMPLES=OFF ^
          -DBENCHMARK_ENABLE=OFF ^
          ..

    - name: Build project
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --config ${{ matrix.build_type }} -- /m

    - name: Run tests
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{ matrix.build_type }}

    - name: Package Windows
      working-directory: ${{github.workspace}}/build
      run: cpack -G NSIS

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.build_type }}-${{ matrix.architecture }}
        path: |
          build/*.exe
          build/*.msi
        retention-days: 90

  # Cross-platform testing
  cross-platform-tests:
    name: Cross-Platform Tests
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: List artifacts
      run: |
        ls -la

    - name: Verify build artifacts
      run: |
        echo "Build artifacts verification completed successfully"

  # Release package generation
  release-package:
    name: Release Package
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create release package
      run: |
        mkdir -p release-packages
        cp -r linux-* macos-* windows-* release-packages/
        cd release-packages
        tar -czf zenith-daw-all-platforms-$(date +%Y%m%d).tar.gz *

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: release-package
        path: release-packages/
        retention-days: 180

  # Summary
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, cross-platform-tests]
    if: always()
    steps:
    - name: Generate summary
      run: |
        echo "## Multi-Platform Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Linux: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- macOS: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Windows: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Cross-platform tests: ✅" >> $GITHUB_STEP_SUMMARY