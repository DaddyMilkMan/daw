name: Tests

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/desktop/Source/**'
      - 'apps/desktop/include/**'
      - 'apps/desktop/Source/tests/**'
      - 'CMakeLists.txt'
      - '.github/workflows/test.yml'

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libasound2-dev \
          libjack-jackd2-dev \
          libfreetype6-dev \
          libx11-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxcomposite-dev \
          mesa-common-dev \
          libgl1-mesa-dev \
          libcurl4-openssl-dev \
          libwebkit2gtk-4.0-dev

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

    - name: Build Tests
      run: |
        cd build
        cmake --build . --target ZenithDAWTests -j$(nproc)

    - name: Run Tests
      run: |
        cd build
        ./ZenithDAWTests

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux
        path: build/Testing/

  test-macos:
    name: Test on macOS
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew install cmake

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

    - name: Build Tests
      run: |
        cd build
        cmake --build . --target ZenithDAWTests -j$(sysctl -n hw.ncpu)

    - name: Run Tests
      run: |
        cd build
        ./ZenithDAWTests

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-macos
        path: build/Testing/

  test-windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

    - name: Build Tests
      run: |
        cd build
        cmake --build . --config Release --target ZenithDAWTests

    - name: Run Tests
      run: |
        cd build
        .\ZenithDAWTests.exe

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows
        path: build/Testing/
