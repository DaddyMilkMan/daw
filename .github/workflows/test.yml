name: Tests

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'zenith-core/Source/instruments/**'
      - 'zenith-core/include/CommandAPI.h'
      - 'zenith-core/src/CommandAPI.cpp'
      - 'zenith-core/tests/**'
      - 'zenith-core/CMakeLists.txt'
      - '.github/workflows/test.yml'

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libasound2-dev \
          libjack-jackd2-dev \
          libfreetype6-dev \
          libx11-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxcomposite-dev \
          mesa-common-dev \
          libgl1-mesa-dev \
          libcurl4-openssl-dev \
          libwebkit2gtk-4.0-dev

    - name: Configure CMake
      run: |
        cd zenith-core
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build Tests
      run: |
        cd zenith-core/build
        cmake --build . --target ProjectStateTests -j$(nproc)
        cmake --build . --target RecordingAutomationTests -j$(nproc)
        cmake --build . --target InstrumentValidationTests -j$(nproc)
        cmake --build . --target PresetRegressionTests -j$(nproc)

    - name: Run Tests
      run: |
        cd zenith-core/build
        ctest --output-on-failure --verbose

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux
        path: zenith-core/build/Testing/

  test-macos:
    name: Test on macOS
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew install cmake

    - name: Configure CMake
      run: |
        cd zenith-core
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build Tests
      run: |
        cd zenith-core/build
        cmake --build . --target ProjectStateTests -j$(sysctl -n hw.ncpu)
        cmake --build . --target RecordingAutomationTests -j$(sysctl -n hw.ncpu)
        cmake --build . --target InstrumentValidationTests -j$(sysctl -n hw.ncpu)
        cmake --build . --target PresetRegressionTests -j$(sysctl -n hw.ncpu)

    - name: Run Tests
      run: |
        cd zenith-core/build
        ctest --output-on-failure --verbose

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-macos
        path: zenith-core/build/Testing/

  test-windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: |
        cd zenith-core
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build Tests
      run: |
        cd zenith-core/build
        cmake --build . --config Release --target ProjectStateTests
        cmake --build . --config Release --target RecordingAutomationTests
        cmake --build . --config Release --target InstrumentValidationTests
        cmake --build . --config Release --target PresetRegressionTests

    - name: Run Tests
      run: |
        cd zenith-core/build
        ctest -C Release --output-on-failure --verbose

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-windows
        path: zenith-core/build/Testing/
