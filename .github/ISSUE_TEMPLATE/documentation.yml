name: 📚 Documentation
description: Report documentation issues or request improvements
title: "[DOC] "
labels: ["documentation", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Zenith DAW documentation! Please provide as much detail as possible.

  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation Type
      description: What type of documentation issue is this?
      options:
        - Missing Documentation
        - Outdated Information
        - Incorrect Information
        - Unclear Explanation
        - Formatting Issues
        - Broken Links
        - Typo/Spelling Error
        - Request for New Documentation
        - Translation/Localization
        - Examples needed
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component's documentation needs improvement?
      options:
        - Getting Started Guide
        - Installation Instructions
        - User Manual
        - API Documentation
        - Developer Documentation
        - Tutorial/Guide
        - Reference Manual
        - Release Notes
        - FAQ
        - Code Comments
        - Wiki
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief summary of the documentation issue
      placeholder: A clear description of what's wrong with the documentation
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Location
      description: Where is the documentation that needs improvement?
      placeholder: |
        **File:** /docs/PATH_TO_FILE.md
        **URL:** https://docs.zenithdaw.com/PATH_TO_PAGE
        **Section:** [Section name or heading]
        **Line Number:** [If applicable]
    validations:
      required: true

  - type: textarea
    id: current-content
    attributes:
      label: Current Content
      description: What does the current documentation say?
      placeholder: |
        [Copy and paste the current text that needs improvement]

        **Screenshot:**
        [If applicable, describe what's shown in screenshots]
    validations:
      required: true

  - type: textarea
    id: suggested-improvement
    attributes:
      label: Suggested Improvement
      description: How would you like to see it improved?
      placeholder: |
        **Proposed changes:**
        [Describe the specific changes you suggest]

        **Improved version:**
        [Provide the corrected or improved text]
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this documentation improvement?
      options:
        - 🟢 Critical - Information is missing or incorrect, causing issues
        - 🟡 High - Significantly impacts user experience
        - 🔵 Medium - Minor usability improvement
        - ⚪ Low - Cosmetic or minor improvement
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any additional context about the issue
      placeholder: |
        **User Experience:**
        [Describe how this documentation issue affects users]

        **Impact:**
        [Explain the impact of the documentation problem]

        **Target Audience:**
        [Who is this documentation for?]
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have identified the specific location of the documentation issue
          required: true
        - label: I have provided the current content that needs improvement
          required: true
        - label: I have suggested specific improvements
          required: true
        - label: I have included screenshots if applicable
          required: false
        - label: I have explained the impact of this documentation issue
          required: false