# GitHub Configuration Settings for Zenith DAW
# These settings configure various GitHub features and behaviors

# Repository Settings
repository:
  description: "Zenith DAW - A modern, cross-platform Digital Audio Workstation"
  homepage: "https://zenithdaw.com"
  topics:
    - "daw"
    - "audio"
    - "music-production"
    - "cross-platform"
    - "open-source"
    - "audio-engine"
    - "vst"
    - "au"
    - "juce"
    - "c++"
    - "real-time"
  default_branch: "master"
  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: true
  has_discussions: true
  has_pages: true
  allow_forking: true
  allow_update_branch: true
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: true

# Branch Protection Rules
branch_protection:
  main:
    required_status_checks:
      - continuous-integration/travis-ci
      - continuous-integration/travis-ci-pr
      - SecurityAgent
      - TestingAgent
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: false
      require_code_owner_reviews: true
    required_linear_history: true
    restrict_pushes: true
    required_conversation_resolution: true
    enforce_admins: false

  develop:
    required_status_checks:
      - SecurityAgent
      - TestingAgent
    required_pull_request_reviews:
      required_approving_review_count: 1
      dismiss_stale_reviews: true
      require_code_owner_reviews: false
    required_linear_history: true
    restrict_pushes: false
    enforce_admins: false

# Team and Collaborator Settings
teams:
  core-developers:
    description: "Core development team with full repository access"
    permission: "admin"
    members:
      - "micahcooley"

  contributors:
    description: "Community contributors with write access"
    permission: "write"
    members: []

  documentation:
    description: "Documentation team"
    permission: "write"
    members: []

# Code Owner Configuration
codeowners:
  "/docs/**": ["@micahcooley"]
  "/README.md": ["@micahcooley"]
  "/LICENSE": ["@micahcooley"]
  "/.github/**": ["@micahcooley"]
  "/CMakeLists.txt": ["@micahcooley"]

# Issue Template Configuration
issue_templates:
  bug_report:
    enabled: true
    title: "[Bug] "
    labels: ["bug"]
  feature_request:
    enabled: true
    title: "[Feature] "
    labels: ["enhancement"]
  documentation:
    enabled: true
    title: "[Documentation] "
    labels: ["documentation"]
  community:
    enabled: true
    types: ["discussion", "showcase", "help", "collaboration"]

# Pull Request Template Configuration
pr_templates:
  default:
    enabled: true
    title: "[PR] "
    labels: ["pull-request"]
    assignees: []
    body:
      - type: markdown
        attributes:
          value: |
            ## Description
            Please provide a clear and concise description of what this pull request accomplishes.

  community:
    enabled: true
    title: "[Community] "
    labels: ["community", "pull-request"]
    assignees: []
    body:
      - type: markdown
        attributes:
          value: |
            ## Community Contribution
            Thank you for your community contribution! Please provide a detailed description of what this PR accomplishes.

  documentation:
    enabled: true
    title: "[Documentation] "
    labels: ["documentation", "pull-request"]
    assignees: []
    body:
      - type: markdown
        attributes:
          value: |
            ## Documentation Update
            Thank you for improving our documentation! Please provide details about the changes made.

# Automation Configuration
automation:
  dependabot:
    enabled: true
    update_schedule: "weekly"
    assignees: ["@micahcooley"]
    labels: ["dependencies", "automated"]

  stale:
    enabled: true
    days_until_stale: 30
    days_until_close: 7
    stale_message: "This issue has been marked as stale and will be closed in 7 days if no further activity occurs."
    close_message: "This issue has been closed due to inactivity."

  auto_assign:
    enabled: true
    assignees: []
    teams: []

# Security Configuration
security:
  vulnerability_alerts:
    enabled: true
    create_alert: true
    assignees: ["@micahcooley"]

  secret_scanning:
    enabled: true
    alert_threshold: "all"

  codeql:
    enabled: true
    languages: ["cpp", "python", "javascript", "typescript"]
    alerts: true
    assignees: ["@micahcooley"]

# Community Guidelines
community_guidelines:
  code_of_conduct:
    enabled: true
    file: "CODE_OF_CONDUCT.md"

  contribution_guidelines:
    enabled: true
    file: "CONTRIBUTING.md"

  support_channels:
    discord: "https://discord.gg/zenith-daw"
    discussions: "https://github.com/your-repo/zenith-daw/discussions"
    email: "support@zenithdaw.com"

  moderation:
    enabled: true
    team: ["@micahcooley"]
    response_time: 24

# Performance Configuration
performance:
  lfs:
    enabled: true
    files:
      - "*.wav"
      - "*.mp3"
      - "*.flac"
      - "*.aiff"
      - "*.png"
      - "*.jpg"
      - "*.jpeg"
      - "*.gif"
      - "*.mp4"
      - "*.avi"

  cache:
    enabled: true
    max_size: 10
    ttl: 3600

# Analytics Configuration
analytics:
  traffic:
    enabled: true
    referrers_limit: 10
    paths_limit: 10

  insights:
    enabled: true
    deploy_key: "github-pages-deploy-key"

# Monitoring and Alerts
monitoring:
  alerts:
    enabled: true
    channels:
      - slack: "zenith-daw-alerts"
      - email: "alerts@zenithdaw.com"

  metrics:
    enabled: true
    dashboards:
      - "performance"
      - "security"
      - "community"