# =============================================================================
# Docker Compose Configuration for Zenith DAW
# =============================================================================
# This configuration provides multiple services for building and running
# Zenith DAW in containerized environments.
#
# Usage:
#   docker-compose build              # Build all images
#   docker-compose up build          # Build the project
#   docker-compose up runtime        # Run the application
#   docker-compose up development     # Start development shell
#   docker-compose down              # Stop and remove containers
#
# For more information, see BUILDING.md
# =============================================================================

version: '3.8'

services:
  # Build service - builds the project
  build:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    volumes:
      - type: bind
        source: .
        target: /workspace
    working_dir: /workspace
    command: cmake . && cmake --build . -j$(nproc)
    environment:
      - CC=gcc
      - CXX=g++
      - CMAKE_BUILD_TYPE=Release
    profiles:
      - build

  # Development service - provides development environment
  development:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    volumes:
      - type: bind
        source: .
        target: /workspace
    working_dir: /workspace
    command: bash
    environment:
      - CC=gcc
      - CXX=g++
    stdin_open: true
    tty: true
    profiles:
      - development
      - all

  # Runtime service - runs the built application
  runtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    volumes:
      - type: bind
        source: ./build
        target: /workspace/build
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - PULSE_SERVER=${PULSE_SERVER:-tcp:localhost:4713}
    profiles:
      - runtime
      - all

  # CI service - optimized for CI/CD pipelines
  ci:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
    working_dir: /workspace
    command: >
      sh -c "
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DZENITH_ENABLE_SKIA=ON \
          -DZENITH_ENABLE_WCET=OFF \
        && cmake --build build -j$(nproc) \
        && ctest --output-on-failure
      "
    environment:
      - CC=gcc
      - CXX=g++
      - CI=true
    profiles:
      - ci
      - all

  # Cache service - for dependency caching
  cache:
    image: alpine
    volumes:
      - type: volume
        source: cmake-cache
        target: /cache
    command: sleep infinity
    profiles:
      - cache

  # Volume for persistent cache
volumes:
  cmake-cache:

# Default profiles
profiles:
  - build
  - development
  - runtime
  - ci
  - all